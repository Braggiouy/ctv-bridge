name: Reusable Platform Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      platform-arg:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      version:
        required: false
        type: string

jobs:
  build:
    name: Build ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Set Version
        if: ${{ inputs.version != '' }}
        run: |
          node -e "const fs = require('fs'); const pkgPath = 'package.json'; const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8')); pkg.version = '${{ inputs.version }}'; fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');"

      - name: Build
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx vite build && bunx electron-builder ${{ inputs.platform-arg }} -p never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            release/**/*-setup.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.zip
            release/**/*.yml
            release/**/*.blockmap
          retention-days: 1
